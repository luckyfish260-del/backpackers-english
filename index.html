<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0">
  <title>背包客英文 - 雲端學習平台</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --sidebar-bg: #ffffff;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --danger: #ef4444;
      --accent: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* 遮罩 (手機端) */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 40;
    }
    .overlay.active { display: block; }

    /* 左側選單 */
    aside {
      width: 320px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 50;
      transition: transform 0.25s ease;
    }

    .sidebar-header {
      padding: 1rem 1.1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar-header h2 {
      font-size: 1.15rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sub-tag {
      font-size: 0.72rem;
      color: var(--success);
      margin-top: 3px;
    }

    .tree-box {
      flex: 1;
      overflow-y: auto;
      padding: 0.6rem;
    }

    .folder-group { margin-bottom: 0.6rem; }
    .folder-btn {
      width: 100%;
      text-align: left;
      padding: 0.5rem 0.65rem;
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #334155;
    }
    .folder-btn:hover { background: #e2e8f0; }

    .unit-list {
      padding-left: 0.5rem;
      margin-top: 0.3rem;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .unit-list.collapsed { display: none; }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0.45rem 0.6rem;
      font-size: 0.82rem;
      color: #475569;
      border-radius: 5px;
      cursor: pointer;
      border: 1px solid transparent;
      text-decoration: none;
    }
    .nav-item:hover { background: #f1f5f9; color: var(--text); }
    .nav-item.active { background: #eff6ff; color: var(--primary); font-weight: 600; border-color: #bfdbfe; }
    .nav-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* 右側主內容區 */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    .top-bar {
      padding: 0.75rem 1.25rem;
      background: #fff;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }
    .top-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      overflow: hidden;
    }
    .menu-btn {
      display: none;
      background: #fff;
      border: 1px solid var(--border);
      padding: 0.35rem 0.6rem;
      border-radius: 6px;
      font-size: 1.1rem;
      cursor: pointer;
    }
    .top-title {
      font-size: 1.1rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .share-btn {
      padding: 0.4rem 0.8rem;
      font-size: 0.8rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .share-btn:hover { background: #f8fafc; border-color: #cbd5e1; }

    /* 全局常駐音訊控制列 */
    .player-dock {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 0.6rem 1.25rem;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.8rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }
    .now-playing {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary);
      min-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    audio {
      height: 36px;
      flex: 1;
      min-width: 250px;
      outline: none;
    }
    .player-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ctrl-btn {
      border: 1px solid var(--border);
      background: #fff;
      padding: 4px 8px;
      font-size: 0.78rem;
      border-radius: 4px;
      cursor: pointer;
    }
    .ctrl-btn:hover { background: #f1f5f9; }

    .main-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      -webkit-overflow-scrolling: touch;
    }
    .content-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
      min-height: 80%;
    }

    /* 題庫組件 */
    .q-box {
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.2rem;
      margin-bottom: 1.2rem;
    }
    .q-text {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      line-height: 1.6;
    }
    .opt-grid {
      display: grid;
      gap: 0.45rem;
    }
    .opt-btn {
      text-align: left;
      padding: 0.55rem 0.85rem;
      border: 1px solid var(--border);
      background: #f8fafc;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .opt-btn:hover { background: #f1f5f9; }
    .opt-btn.correct { background: #ecfdf5; border-color: var(--success); color: #065f46; font-weight: 700; }
    .opt-btn.wrong { background: #fef2f2; border-color: var(--danger); color: #991b1b; }
    .ans-box {
      margin-top: 0.6rem;
      padding: 0.65rem 0.85rem;
      background: #f0fdf4;
      border-left: 4px solid var(--success);
      border-radius: 4px;
      font-size: 0.88rem;
    }
    .ans-box.hidden { display: none; }

    /* 影音嵌入容器 */
    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-top: 1rem;
    }
    .video-container iframe {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      border: none;
    }

    /* 上傳框樣式 */
    .upload-zone {
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      padding: 2rem;
      text-align: center;
      background: #fafafa;
      cursor: pointer;
    }
    .upload-zone:hover { border-color: var(--primary); background: #f0f7ff; }

    @media (max-width: 768px) {
      aside {
        position: fixed;
        top: 0; bottom: 0; left: 0;
        width: 80%;
        max-width: 300px;
        transform: translateX(-100%);
      }
      aside.open { transform: translateX(0); }
      .menu-btn { display: block; }
      .player-dock { padding: 0.5rem 0.75rem; }
      .now-playing { width: 100%; margin-bottom: 2px; }
      .main-scroll { padding: 0.75rem; }
      .content-card { padding: 15px; }
    }
  </style>
</head>
<body>

  <div class="overlay" id="overlay" onclick="toggleNav()"></div>

  <!-- 左側導覽列 -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div>
        <h2>🎒 背包客英文</h2>
        <div class="sub-tag">● 雲端整合學習系統</div>
      </div>
      <button class="menu-btn" onclick="toggleNav()" style="display:block;">✕</button>
    </div>
    
    <div class="tree-box">
      <!-- MP3 音檔清單 -->
      <div class="folder-group">
        <button class="folder-btn" onclick="toggleFolder('folder-audio')">
          <span>🎧 課文語音 MP3 (Track 01-30)</span>
          <span id="arr-folder-audio">▼</span>
        </button>
        <div class="unit-list" id="folder-audio"></div>
      </div>

      <!-- 期中考題庫 -->
      <div class="folder-group">
        <button class="folder-btn" onclick="toggleFolder('folder-mid')">
          <span>📘 期中考題庫 (Unit 1 ~ 8)</span>
          <span id="arr-folder-mid">▼</span>
        </button>
        <div class="unit-list" id="folder-mid"></div>
      </div>

      <!-- 期末考題庫 -->
      <div class="folder-group">
        <button class="folder-btn" onclick="toggleFolder('folder-fin')">
          <span>📕 期末考題庫 (Unit 9 ~ 16)</span>
          <span id="arr-folder-fin">▼</span>
        </button>
        <div class="unit-list" id="folder-fin"></div>
      </div>

      <!-- 影音串流專區 -->
      <div class="folder-group">
        <button class="folder-btn" onclick="toggleFolder('folder-video')">
          <span>📺 影音專區 (YouTube 頻道串聯)</span>
          <span id="arr-folder-video">▼</span>
        </button>
        <div class="unit-list" id="folder-video">
          <div class="nav-item" onclick="loadVideoView('V01 情感分析與文字任務', 'https://www.youtube.com/embed/dQw4w9WgXcQ')">
            <span>🎬 歷屆解題與聽力解析</span>
          </div>
        </div>
      </div>

      <!-- 檔案自傳分享專區 -->
      <div class="folder-group">
        <button class="folder-btn" onclick="toggleFolder('folder-tools')">
          <span>📁 自訂音檔/講義分享</span>
          <span id="arr-folder-tools">▼</span>
        </button>
        <div class="unit-list" id="folder-tools">
          <div class="nav-item" onclick="loadUploadView()">
            <span>📤 本機上傳與暫存播放</span>
          </div>
        </div>
      </div>
    </div>
  </aside>

  <!-- 右側主要區塊 -->
  <main>
    <header class="top-bar">
      <div class="top-left">
        <button class="menu-btn" onclick="toggleNav()">☰</button>
        <div class="top-title" id="pageTitle">載入中...</div>
      </div>
      <button class="share-btn" onclick="copyShareUrl()">🔗 複製單元分享連結</button>
    </header>

    <!-- 頂部音訊控制台 (支援自動下一首與倍速) -->
    <div class="player-dock">
      <div class="now-playing" id="trackName">未播放音訊</div>
      <audio id="mainAudio" controls preload="metadata"></audio>
      <div class="player-controls">
        <button class="ctrl-btn" onclick="changeSpeed(0.75)">0.75x</button>
        <button class="ctrl-btn" onclick="changeSpeed(1.0)">1.0x</button>
        <button class="ctrl-btn" onclick="changeSpeed(1.25)">1.25x</button>
        <button class="ctrl-btn" onclick="playNextTrack()">⏭️ 下一首</button>
      </div>
    </div>

    <!-- 內容滾動區 -->
    <div class="main-scroll">
      <div class="content-card" id="mainCard"></div>
    </div>
  </main>

  <script>
    // 1. MP3 播放清單（對應 GitHub 已上傳的檔案）
    const AUDIO_TRACKS = [];
    for (let i = 1; i <= 30; i++) {
      const pad = String(i).padStart(2, '0');
      AUDIO_TRACKS.push({
        id: `track-${pad}`,
        title: `Travel Beyond 1_Track ${pad}.mp3`,
        url: `Travel%20Beyond%201_Track%20${pad}.mp3`
      });
    }

    let currentTrackIdx = 0;
    const audioEl = document.getElementById('mainAudio');

    // 2. 考題資料庫 (Unit 1 ~ 16)
    const QUIZ_DATA = {
      midterm: [
        {
          id: "u1", title: "Unit Test 1 Taking a Vacation",
          qs: [
            { q: "1. There are two ______ languages in Canada: English and French.", o: ["A. amazing", "B. official", "C. attractive", "D. scorching"], a: "B", e: "加拿大的官方語言是英文與法文 (official languages)。" },
            { q: "2. If you don't have much time to do research, why don't you join a ______ for this vacation?", o: ["A. site", "B. pyramid", "C. team", "D. tour"], a: "D", e: "join a tour = 參加旅行團。" },
            { q: "3. Joe has been ______ by Egyptian history. He wants to visit Egypt.", o: ["A. fascinated", "B. amazing", "C. interested", "D. guessed"], a: "A", e: "be fascinated by = 被……深深吸引。" },
            { q: "4. She needs to ______ this paper to show that she agrees with it.", o: ["A. join", "B. catch", "C. sign", "D. visit"], a: "C", e: "sign a paper = 簽署文件。" },
            { q: "5. Madrid is the ______ city of Spain.", o: ["A. capital", "B. official", "C. themed", "D. outdoor"], a: "A", e: "capital city = 首都。" },
            { q: "6. College students have a one-week spring ______ this year in April.", o: ["A. destination", "B. station", "C. bank", "D. break"], a: "D", e: "spring break = 春假。" },
            { q: "7. The family is going to ______ a vacation next month.", o: ["A. get on", "B. go on", "C. go to", "D. due to"], a: "B", e: "go on a vacation = 去度假。" },
            { q: "8. I've always wanted to ______ the Sahara. It is my dream.", o: ["A. visit", "B. go", "C. take", "D. get"], a: "A", e: "visit 直接接名詞地名。" },
            { q: "9. They went to the Great Barrier Reef and did ______ there. That was wonderful.", o: ["A. hiking", "B. skiing", "C. bungee jumping", "D. snorkeling"], a: "D", e: "大堡礁必做活動 snorkeling (浮潛)。" },
            { q: "10. I'm ______ of nature. Visiting New Zealand has been my dream.", o: ["A. found", "B. find", "C. fond", "D. open"], a: "C", e: "be fond of 喜愛……。" }
          ]
        },
        {
          id: "u2", title: "Unit Test 2 Preparing for a Trip",
          qs: [
            { q: "1. The battery of our cell phone is low. We need to ______ it soon.", o: ["A. change", "B. make", "C. charge", "D. pack"], a: "C", e: "charge a battery = 為電池充電。" },
            { q: "2. We'll stay at the beach the whole day. Don't forget to bring your ______.", o: ["A. padlock", "B. sunscreen", "C. shower gel", "D. toothpaste"], a: "B", e: "sunscreen = 防曬乳。" },
            { q: "3. Judy is going to wear ______ from now on. She is tired of glasses.", o: ["A. contact lenses", "B. combs", "C. electric adaptors", "D. makeup"], a: "A", e: "contact lenses = 隱形眼鏡。" },
            { q: "4. I woke up seeing the sky ______. It looked like a storm was coming.", o: ["A. drizzling", "B. balmy", "C. scorching", "D. overcast"], a: "D", e: "overcast = 陰沉的，陰雲密佈的。" },
            { q: "5. Where's the key to the ______? Now we have trouble opening this closet.", o: ["A. padlock", "B. medicine", "C. trunks", "D. brush"], a: "A", e: "padlock = 掛鎖。" },
            { q: "6. It's ______ outside. I don't think you should go out without your coat.", o: ["A. drizzling", "B. balmy", "C. foggy", "D. freezing"], a: "D", e: "freezing = 極度寒冷。" },
            { q: "7. They are good at finding great ______ for their plane tickets and hotels.", o: ["A. packs", "B. breeze", "C. deals", "D. destinations"], a: "C", e: "good deals = 划算的特惠。" },
            { q: "8. Jack always stays in a bed of a ______ so that he can have roommates and meet new people.", o: ["A. campsite", "B. hostel", "C. hotel", "D. resort"], a: "B", e: "hostel = 青年旅館。" },
            { q: "9. I enjoyed ______ friends. So I joined different clubs when I was studying at university.", o: ["A. to see", "B. seeing", "C. to make", "D. making"], a: "D", e: "enjoy + V-ing，make friends = 交朋友。" },
            { q: "10. It's so ______ in the mountains now. But don't worry, it will clear up later.", o: ["A. breezy", "B. humid", "C. foggy", "D. snowy"], a: "C", e: "foggy = 起霧的。" }
          ]
        },
        {
          id: "u3", title: "Unit Test 3 Advance Bookings",
          qs: [
            { q: "1. Their ______ in the campsite has been canceled. They decided to stay in a nearby hotel.", o: ["A. spot", "B. resort", "C. tour", "D. event"], a: "A", e: "a camping spot = 露營營位。" },
            { q: "2. The ______ tour doesn't sound easy. The forest covers a lot of land so it's quite tiring.", o: ["A. bus", "B. historical", "C. hiking", "D. departing"], a: "C", e: "hiking tour = 健行行程。" },
            { q: "3. The hotel she ______ was too expensive that her travel partner was not happy with it.", o: ["A. took", "B. booked", "C. got", "D. returned"], a: "B", e: "book a hotel = 訂飯店。" },
            { q: "4. She was not able to find a direct flight. So she ______ in Bangkok.", o: ["A. returned", "B. upgraded", "C. transferred", "D. entered"], a: "C", e: "transfer = 轉機。" },
            { q: "5. They didn't have enough ______ to pay. Luckily, the restaurant took credit cards.", o: ["A. reasons", "B. charge", "C. arrivals", "D. cash"], a: "D", e: "cash = 現金。" },
            { q: "6. In order to ______ our booking, we should check our e-mail to see if the company send any letters in.", o: ["A. confirm", "B. reserve", "C. make", "D. exchange"], a: "A", e: "confirm a booking = 確認預訂。" },

            { q: "8. The hotel offers a free ______ from the airport. You can find it when you come out of the exit.", o: ["A. travel", "B. visitor", "C. dorm", "D. pickup"], a: "D", e: "free pickup = 免費機場接送。" },
            { q: "9. You have to show your boarding ______ when you buy things at the duty-free shops at the airport.", o: ["A. ticket", "B. pass", "C. paper", "D. test"], a: "B", e: "boarding pass = 登機證。" },
            { q: "10. The table has been ______ for a family of four. Sorry, you cannot sit here.", o: ["A. done", "B. departed", "C. left", "D. reserved"], a: "D", e: "reserved = 已被預留/訂位。" }
          ]
        },
        {
          id: "u4", title: "Unit Test 4 Airport Check-In",
          qs: [
            { q: "1. Some airports are so huge that if you go to the wrong ______ you have trouble catching your flight.", o: ["A. escalator", "B. terminal", "C. cart", "D. walkway"], a: "B", e: "terminal = 航廈。" },
            { q: "2. I need to bring an extra ______ for my cell phone. I'm expecting an important call and can't miss it.", o: ["A. iPad", "B. sunscreen", "C. wallet", "D. powerbank"], a: "D", e: "powerbank = 行動電源。" },
            { q: "3. You'll need to have your ______ to check in for your flight. Don't forget to keep it with you all the time.", o: ["A. passbook", "B. passenger", "C. passport", "D. passerby"], a: "C", e: "passport = 護照。" },
            { q: "4. At ______ people are examined to see if they are carrying something dangerous.", o: ["A. security check", "B. the exchange kiosk", "C. Immigration", "D. the boarding gate"], a: "A", e: "security check = 安檢。" },
            { q: "5. You choose the word ______ if you are taking out some money from the ATM.", o: ["A. deposit", "B. withdrawal", "C. cash", "D. fee"], a: "B", e: "withdrawal = 提款。" },
            { q: "6. The exchange ______ between US dollar and euro is 0.77.", o: ["A. fare", "B. charge", "C. fee", "D. rate"], a: "D", e: "exchange rate = 匯率。" },
            { q: "7. There are ______ buses between the train station and the airport. You can find them when you walk outside the building.", o: ["A. shuttle", "B. connecting", "C. transferring", "D. waiting"], a: "A", e: "shuttle bus = 接駁車。" },

          ]
        },
        {
          id: "u5", title: "Unit Test 5 On Board",
          qs: [
            { q: "1. They have ______ on board to make sure all the people are happy with the flight.", o: ["A. attendants", "B. passengers", "C. customers", "D. airlines"], a: "A", e: "flight attendants = 機艙空服員。" },
            { q: "2. I hope they'll ______ the meal soon. I'm very hungry.", o: ["A. take", "B. get", "C. serve", "D. reserve"], a: "C", e: "serve the meal = 供應餐點。" },
            { q: "3. People are sitting at the waiting area and expecting to ______ the plane soon.", o: ["A. make", "B. book", "C. sign", "D. board"], a: "D", e: "board the plane = 登機。" },

          id: "u16", title: "Unit Test 16 Emergency & Lost Items",
          qs: [
            { q: "1. I lost my ______. Luckily, I don't have too much money in it.", o: ["A. tablet", "B. smartphone", "C. credit card", "D. wallet"], a: "D", e: "wallet = 錢包。" },
            { q: "2. You were robbed? I think you should go to a police station to ______ a report.", o: ["A. take", "B. file", "C. get", "D. watch"], a: "B", e: "file a report = 報案/做筆錄。" },
            { q: "3. I need to ______ some money from the ATM. Is there one nearby?", o: ["A. withdraw", "B. do", "C. change", "D. exchange"], a: "A", e: "withdraw money = 領錢。" },
            { q: "4. You have to ______ the form in order to check in to the hotel.", o: ["A. full of", "B. fill out", "C. fix at", "D. fool around"], a: "B", e: "fill out the form = 填寫表格。" },
            { q: "5. This yellow ______ looks small, but it can carry a lot. I always use it for my trips.", o: ["A. form", "B. handle", "C. suitcase", "D. visitor"], a: "C", e: "suitcase = 行李箱。" },
            { q: "6. The most important travel document is your ______. You should keep it in a very safe place.", o: ["A. check", "B. passport", "C. boarding pass", "D. air ticket"], a: "B", e: "passport = 護照。" },
            { q: "7. The screen of a(n) ______ is much bigger than it of a smartphone. So people usually read an e-book on it.", o: ["A. charger", "B. earphone", "C. password", "D. tablet"], a: "D", e: "tablet = 平板電腦。" },
            { q: "8. There is always a line at the bottom of the report for you to ______. It shows that you agree with everything on it.", o: ["A. sign", "B. fill up", "C. withdraw", "D. pass though"], a: "A", e: "sign = 簽名。" },
            { q: "9. The ______ is always changing. So when you need to buy local money, you need to check it.", o: ["A. entrance fee", "B. bus fare", "C. exchange rate", "D. service charge"], a: "C", e: "exchange rate = 匯率。" },
            { q: "10. If a ______ happens, you should go to a police station to report it.", o: ["A. robber", "B. robbery", "C. lost and found", "D. loss"], a: "B", e: "robbery = 搶劫事件。" }
          ]
        }
      ]
    };

    let activeUnitId = "";

    // 介面折疊與開關
    function toggleNav() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('active');
    }

    function toggleFolder(id) {
      const box = document.getElementById(id);
      const arr = document.getElementById('arr-' + id);
      box.classList.toggle('collapsed');
      arr.textContent = box.classList.contains('collapsed') ? '▶' : '▼';
    }

    // 初始化左側導覽目錄
    function initSidebar() {
      // 1. 音訊清單
      const audioBox = document.getElementById('folder-audio');
      AUDIO_TRACKS.forEach((track, idx) => {
        const item = document.createElement('div');
        item.className = 'nav-item';
        item.id = `nav-${track.id}`;
        item.innerHTML = `<span>🎵 ${track.title}</span>`;
        item.onclick = () => playAudio(idx);
        audioBox.appendChild(item);
      });

      // 2. 期中考
      const midBox = document.getElementById('folder-mid');
      QUIZ_DATA.midterm.forEach(u => {
        const item = document.createElement('div');
        item.className = 'nav-item';
        item.id = `nav-${u.id}`;
        item.innerHTML = `<span>📄 ${u.title}</span>`;
        item.onclick = () => loadQuizView(u, 'midterm');
        midBox.appendChild(item);
      });

      // 3. 期末考
      const finBox = document.getElementById('folder-fin');
      QUIZ_DATA.final.forEach(u => {
        const item = document.createElement('div');
        item.className = 'nav-item';
        item.id = `nav-${u.id}`;
        item.innerHTML = `<span>📄 ${u.title}</span>`;
        item.onclick = () => loadQuizView(u, 'final');
        finBox.appendChild(item);
      });
    }

    // 音訊播放與自動下一首
    function playAudio(index) {
      if (index < 0 || index >= AUDIO_TRACKS.length) return;
      currentTrackIdx = index;
      const t = AUDIO_TRACKS[index];
      audioEl.src = t.url;
      audioEl.play().catch(e => console.log('Auto-play prevented:', e));
      document.getElementById('trackName').textContent = `正在播放: ${t.title}`;

      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      const activeNav = document.getElementById(`nav-${t.id}`);
      if (activeNav) activeNav.classList.add('active');

      document.getElementById('pageTitle').textContent = t.title;
      document.getElementById('mainCard').innerHTML = `
        <div style="text-align:center; padding: 2rem 0;">
          <h2>🎧 ${t.title}</h2>
          <p style="color:var(--text-muted); margin: 1rem 0;">GitHub 雲端串流播放中，播放完畢將自動跳下一首。</p>
          <div style="margin-top:1.5rem;">
            <button class="ctrl-btn" style="padding:8px 16px;" onclick="playNextTrack()">播放下一首 ⏭️</button>
          </div>
        </div>
      `;
      if (window.innerWidth <= 768) toggleNav();
    }

    function playNextTrack() {
      if (currentTrackIdx + 1 < AUDIO_TRACKS.length) {
        playAudio(currentTrackIdx + 1);
      } else {
        alert("已播放到最後一首！");
      }
    }

    audioEl.addEventListener('ended', playNextTrack);

    function changeSpeed(rate) {
      audioEl.playbackRate = rate;
      document.getElementById('trackName').textContent = `播放速度: ${rate}x`;
    }

    // 載入題庫畫面
    function loadQuizView(unit, type) {
      activeUnitId = unit.id;
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      const activeNav = document.getElementById(`nav-${unit.id}`);
      if (activeNav) activeNav.classList.add('active');

      document.getElementById('pageTitle').textContent = unit.title;
      const card = document.getElementById('mainCard');
      
      let html = `
        <div style="border-bottom: 2px solid var(--primary); padding-bottom: 0.6rem; margin-bottom: 1.5rem; display:flex; justify-content:space-between; align-items:center;">
          <h2>${unit.title}</h2>
          <span style="font-size:0.85rem; color:var(--text-muted);">10 題精選互動測驗</span>
        </div>
      `;

      unit.qs.forEach((q, idx) => {
        html += `
          <div class="q-box" id="q-box-${idx}">
            <div class="q-text">${escapeHtml(q.q)}</div>
            <div class="opt-grid">
              ${q.o.map(opt => `<button class="opt-btn" onclick="checkOption(this, '${opt.charAt(0)}', '${q.a}', ${idx})">${escapeHtml(opt)}</button>`).join('')}
            </div>
            <div class="ans-box hidden" id="ans-box-${idx}">
              <div style="font-weight:700; color:#166534; margin-bottom:3px;">✓ 正確答案: ${q.a}</div>
              <div style="color:#15803d; line-height:1.5;">💡 答案解釋: ${escapeHtml(q.e)}</div>
            </div>
          </div>
        `;
      });

      card.innerHTML = html;
      document.querySelector('.main-scroll').scrollTop = 0;
      if (window.innerWidth <= 768) toggleNav();
    }

    function checkOption(btn, selected, correct, idx) {
      const parent = btn.parentElement;
      Array.from(parent.children).forEach(b => {
        b.classList.remove('correct', 'wrong');
        if (b.innerText.startsWith(correct)) b.classList.add('correct');
      });
      if (selected !== correct) btn.classList.add('wrong');
      document.getElementById(`ans-box-${idx}`).classList.remove('hidden');
    }

    // 載入影音檢視
    function loadVideoView(title, videoUrl) {
      document.getElementById('pageTitle').textContent = title;
      document.getElementById('mainCard').innerHTML = `
        <h2>📺 ${title}</h2>
        <p style="color:var(--text-muted); margin: 0.5rem 0 1rem;">支援在線聆聽與觀看，不佔用本機容量。</p>
        <div class="video-container">
          <iframe src="${videoUrl}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
      `;
      if (window.innerWidth <= 768) toggleNav();
    }

    // 載入本機自訂上傳檢視
    function loadUploadView() {
      document.getElementById('pageTitle').textContent = "本機檔案臨時上傳與播放";
      document.getElementById('mainCard').innerHTML = `
        <h2>📤 自備音檔與講義分享</h2>
        <p style="color:var(--text-muted); margin: 0.5rem 0 1.5rem;">此處可直接載入您電腦裡的本機 MP3 進行測試播放：</p>
        <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
          <input type="file" id="fileInput" accept="audio/*" style="display:none" onchange="handleLocalFile(event)">
          <div style="font-size:2rem; margin-bottom:8px;">📁</div>
          <p>點擊此處選擇本機 MP3 檔案進行播放</p>
        </div>
      `;
      if (window.innerWidth <= 768) toggleNav();
    }

    function handleLocalFile(e) {
      const file = e.target.files[0];
      if (file) {
        const url = URL.createObjectURL(file);
        audioEl.src = url;
        audioEl.play();
        document.getElementById('trackName').textContent = `本地播放: ${file.name}`;
      }
    }

    // 一鍵分享當前頁面連結
    function copyShareUrl() {
      const url = window.location.href;
      navigator.clipboard.writeText(url).then(() => {
        alert("已複製分享連結！同學點開即可直接進入此平台：\n" + url);
      }).catch(() => {
        prompt("請複製以下連結分享給同學：", url);
      });
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[s]));
    }

    window.onload = () => {
      initSidebar();
      // 預設先開啟 Unit 1 題庫
      loadQuizView(QUIZ_DATA.midterm[0], 'midterm');
    };
  </script>
</body>
</html>
