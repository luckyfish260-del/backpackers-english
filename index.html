<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>背包客英文 - 多媒體與題庫學習平台</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --sidebar-bg: #ffffff;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 40;
    }
    .sidebar-overlay.active { display: block; }

    aside {
      width: 320px;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 50;
      transition: transform 0.3s ease;
    }

    .sidebar-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar-header h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
    }
    .close-sidebar-btn {
      display: none;
      background: none;
      border: none;
      font-size: 1.25rem;
      cursor: pointer;
      color: var(--text-muted);
      padding: 4px;
    }
    .db-status {
      font-size: 0.72rem;
      color: var(--success);
      margin-top: 0.2rem;
    }

    .search-box {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
    }
    .search-box input {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.875rem;
      outline: none;
    }

    .file-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 0.75rem;
    }
    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 0.35rem;
      border: 1px solid transparent;
      transition: background 0.15s;
    }
    .file-item:hover { background-color: #f1f5f9; }
    .file-item.active { background-color: #eff6ff; border-color: #bfdbfe; }
    
    .file-info { 
      overflow: hidden; 
      flex: 1;
      margin-right: 0.5rem;
    }
    .file-title {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-meta { font-size: 0.7rem; color: var(--text-muted); margin-top: 0.15rem; }
    
    .btn-delete {
      color: var(--text-muted);
      background: #f1f5f9;
      border: 1px solid var(--border);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .btn-delete:hover, .btn-delete:active { 
      color: #fff; 
      background-color: var(--danger); 
      border-color: var(--danger);
    }

    .sidebar-actions {
      padding: 0.75rem 1rem;
      border-top: 1px solid var(--border);
      background: #fafafa;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .upload-btn-label {
      background-color: var(--primary);
      color: white;
      padding: 0.6rem;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .upload-btn-label:hover { background-color: var(--primary-hover); }
    .add-yt-btn {
      background: #fff;
      border: 1px solid var(--border);
      color: #334155;
      padding: 0.45rem;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 600;
    }
    .add-yt-btn:hover { background: #f1f5f9; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      width: 100%;
    }
    .main-header {
      padding: 0.85rem 1.25rem;
      background: #fff;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      overflow: hidden;
    }
    .menu-toggle-btn {
      display: none;
      background: none;
      border: 1px solid var(--border);
      padding: 0.4rem 0.6rem;
      border-radius: 6px;
      font-size: 1.1rem;
      cursor: pointer;
    }
    .main-header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .action-controls { display: flex; gap: 0.4rem; flex-shrink: 0; }
    .btn {
      padding: 0.4rem 0.75rem;
      font-size: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #fff;
    }
    .btn:hover { background: #f1f5f9; }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }

    .main-body {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      -webkit-overflow-scrolling: touch;
    }

    .content-card {
      background: var(--card-bg);
      border-radius: 8px;
      border: 1px solid var(--border);
      min-height: 100%;
      line-height: 1.65;
      overflow-x: auto;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      width: 100%;
      box-sizing: border-box;
    }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      font-size: 0.72rem;
      font-weight: 600;
      border-radius: 4px;
      background: #e0f2fe;
      color: #0369a1;
      margin-bottom: 0.6rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
      font-size: 0.88rem;
      display: block;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    table th, table td {
      border: 1px solid var(--border);
      padding: 0.55rem 0.75rem;
      text-align: left;
      min-width: 90px;
    }
    table th { background-color: #f1f5f9; }

    .media-container {
      margin: 1.25rem 0;
      background: #0f172a;
      border-radius: 8px;
      padding: 0.75rem;
      display: flex;
      justify-content: center;
    }
    audio, video { width: 100%; max-width: 100%; }
    .yt-iframe-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      max-width: 100%;
      border-radius: 8px;
      margin-top: 1rem;
    }
    .yt-iframe-container iframe {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%; border: 0;
    }

    .editable-area {
      width: 100%;
      height: 450px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem;
      font-family: monospace;
      outline: none;
    }

    @media (max-width: 768px) {
      aside {
        position: fixed;
        top: 0; bottom: 0; left: 0;
        width: 82%;
        max-width: 320px;
        transform: translateX(-100%);
        box-shadow: 2px 0 12px rgba(0,0,0,0.15);
      }
      aside.open { transform: translateX(0); }
      .close-sidebar-btn { display: block; }
      .menu-toggle-btn { display: block; }
      .main-header { padding: 0.65rem 0.85rem; }
      .main-header h1 { font-size: 1rem; }
      .main-body { padding: 0.5rem; }
      .content-card { padding: 10px; border-radius: 6px; }
      .btn { padding: 0.35rem 0.55rem; font-size: 0.75rem; }
    }
  </style>
</head>
<body>

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <aside id="sidebar">
    <div class="sidebar-header">
      <div>
        <h2>🎒 背包客英文</h2>
        <div class="db-status">● 支援縮放與完全清空</div>
      </div>
      <button class="close-sidebar-btn" onclick="closeSidebar()" title="關閉選單">✕</button>
    </div>
    
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜尋項目..." oninput="filterFiles()">
    </div>

    <div class="file-list" id="fileList"></div>

    <div class="sidebar-actions">
      <label class="upload-btn-label">
        <span>➕ 上傳檔案 (Word/PDF/MP3/MP4)</span>
        <input type="file" id="fileInput" accept=".docx,.pdf,.txt,.md,.mp3,.wav,.m4a,.mp4,.webm" multiple style="display:none" onchange="handleFileUpload(event)">
      </label>
      <button class="add-yt-btn" onclick="addYouTubeLink()">🔗 嵌入 YouTube 影片</button>
    </div>
  </aside>

  <main>
    <header class="main-header">
      <div class="header-left">
        <button class="menu-toggle-btn" onclick="openSidebar()" title="開啟選單">☰</button>
        <h1 id="currentDocTitle">載入中...</h1>
      </div>
      <div class="action-controls">
        <button class="btn" onclick="toggleEditMode()" id="editToggleBtn">✏️ 編輯</button>
        <button class="btn btn-primary" onclick="exportData()">💾 備份</button>
      </div>
    </header>

    <div class="main-body">
      <div class="content-card" id="contentCard"></div>
    </div>
  </main>

  <script>
    const DB_NAME = 'BackpackersCleanDB_v3';
    const STORE_NAME = 'documents';
    let db;
    let documents = [];
    let currentDocId = null;
    let isEditing = false;

    function openSidebar() {
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('sidebarOverlay').classList.add('active');
    }
    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarOverlay').classList.remove('active');
    }

    function openDatabase() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const dbInstance = e.target.result;
          if (!dbInstance.objectStoreNames.contains(STORE_NAME)) {
            dbInstance.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
        req.onsuccess = (e) => {
          db = e.target.result;
          resolve(db);
        };
        req.onerror = (e) => reject(e);
      });
    }

    function getAllDocsFromDB() {
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result || []);
      });
    }

    function saveDocToDB(doc) {
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.put(doc);
        tx.oncomplete = () => resolve();
      });
    }

    function deleteDocFromDB(id) {
      return new Promise((resolve) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.delete(id);
        tx.oncomplete = () => resolve();
      });
    }

    async function init() {
      await openDatabase();
      documents = await getAllDocsFromDB();

      // 檢查是否初次使用，若初次建立且為空才放入範本；若使用者手動刪除過則保持空白
      const isUserCleaned = localStorage.getItem('bp_user_cleared_all');
      if (documents.length === 0 && !isUserCleaned) {
        const defaultDoc = {
          id: "doc-syllabus",
          title: "0-2 教學大綱與總學習指引",
          date: "2026/09",
          content: `
            <span class="badge">課程資訊</span>
            <h2>課程名稱：背包客英文 (English for Backpackers)</h2>
            <p><strong>學分數：</strong> 2 學分 ｜ <strong>授課方式：</strong> 全遠距（可點✕刪除此項目）</p>
            <hr style="margin:0.8rem 0;">
            <h3>🎯 評量方式</h3>
            <table>
              <tr><th>項目</th><th>比重</th><th>時程規定</th></tr>
              <tr><td>平時成績</td><td>30%</td><td>2026/12/31 前完成</td></tr>
              <tr><td>期中考試</td><td>30%</td><td>115/11/2 - 115/11/8</td></tr>
              <tr><td>期末考試</td><td>40%</td><td>116/1/4 - 116/1/10</td></tr>
            </table>
          `
        };
        await saveDocToDB(defaultDoc);
        documents = [defaultDoc];
      }

      renderFileList();
      if (documents.length > 0) {
        selectDocument(documents[0].id);
      } else {
        showEmptyView();
      }
    }

    function renderFileList(filter = '') {
      const container = document.getElementById('fileList');
      container.innerHTML = '';
      const filtered = documents.filter(doc => 
        doc.title.toLowerCase().includes(filter.toLowerCase()) ||
        doc.content.toLowerCase().includes(filter.toLowerCase())
      );

      if (filtered.length === 0) {
        container.innerHTML = '<p style="color:#94a3b8; font-size:0.8rem; text-align:center; padding:1.5rem 0;">目前無任何檔案</p>';
        return;
      }

      filtered.forEach(doc => {
        const item = document.createElement('div');
        item.className = `file-item ${doc.id === currentDocId ? 'active' : ''}`;
        
        item.onclick = () => {
          selectDocument(doc.id);
          closeSidebar();
        };

        const fileInfo = document.createElement('div');
        fileInfo.className = 'file-info';
        fileInfo.innerHTML = `
          <div class="file-title">${escapeHtml(doc.title)}</div>
          <div class="file-meta">${doc.date || '教材文件'}</div>
        `;

        const delBtn = document.createElement('button');
        delBtn.className = 'btn-delete';
        delBtn.innerHTML = '✕';
        delBtn.title = '刪除此項目';
        
        delBtn.onclick = (e) => {
          e.preventDefault();
          e.stopPropagation();
          deleteDocument(doc.id);
        };

        item.appendChild(fileInfo);
        item.appendChild(delBtn);
        container.appendChild(item);
      });
    }

    function selectDocument(id) {
      currentDocId = id;
      isEditing = false;
      document.getElementById('editToggleBtn').innerText = '✏️ 編輯';
      renderFileList(document.getElementById('searchInput').value);
      const doc = documents.find(d => d.id === id);
      if (!doc) return;
      document.getElementById('currentDocTitle').innerText = doc.title;
      document.getElementById('contentCard').innerHTML = doc.content;
    }

    function showEmptyView() {
      currentDocId = null;
      document.getElementById('currentDocTitle').innerText = '無文件';
      document.getElementById('contentCard').innerHTML = `
        <div style="text-align:center; padding:4rem 1rem; color:#94a3b8;">
          <div style="font-size:3rem; margin-bottom:1rem;">📂</div>
          <h3 style="color:#64748b; margin-bottom:0.5rem;">目前沒有任何教材</h3>
          <p style="font-size:0.88rem;">已清空所有項目。請點擊左側「➕ 上傳檔案」添加講義、MP3 或嵌入 YouTube 影片。</p>
        </div>
      `;
    }

    async function deleteDocument(id) {
      const doc = documents.find(d => d.id === id);
      const docTitle = doc ? doc.title : '此項目';
      
      const confirmed = window.confirm(`確定要刪除「${docTitle}」嗎？`);
      if (!confirmed) return;

      await deleteDocFromDB(id);
      documents = documents.filter(d => d.id !== id);

      if (documents.length === 0) {
        localStorage.setItem('bp_user_cleared_all', 'true');
        showEmptyView();
      } else if (currentDocId === id) {
        selectDocument(documents[0].id);
      }
      
      renderFileList(document.getElementById('searchInput').value);
    }

    async function handleFileUpload(event) {
      const files = event.target.files;
      if (!files || files.length === 0) return;

      localStorage.removeItem('bp_user_cleared_all');

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const newId = 'doc-' + Date.now() + '-' + i;
        const now = new Date().toLocaleDateString('zh-TW');
        const fileNameNoExt = file.name.replace(/\.[^/.]+$/, "");
        const fileExt = file.name.split('.').pop().toLowerCase();

        let generatedContent = '';

        if (['mp3', 'wav', 'm4a'].includes(fileExt)) {
          const base64Audio = await fileToBase64(file);
          generatedContent = `
            <span class="badge">聽力音訊</span>
            <h2>🎧 ${escapeHtml(file.name)}</h2>
            <div class="media-container">
              <audio controls controlsList="nodownload">
                <source src="${base64Audio}" type="${file.type || 'audio/mp3'}">
              </audio>
            </div>
          `;
        } else if (['mp4', 'webm'].includes(fileExt)) {
          const base64Video = await fileToBase64(file);
          generatedContent = `
            <span class="badge">教學影片</span>
            <h2>🎬 ${escapeHtml(file.name)}</h2>
            <div class="media-container">
              <video controls>
                <source src="${base64Video}" type="${file.type || 'video/mp4'}">
              </video>
            </div>
          `;
        } else if (fileExt === 'docx') {
          const arrayBuffer = await file.arrayBuffer();
          const result = await mammoth.convertToHtml({ arrayBuffer });
          generatedContent = `
            <span class="badge">Word 講義</span>
            <h2>📄 ${escapeHtml(file.name)}</h2>
            <div style="margin-top:1rem; line-height: 1.8;">${result.value || '<p>此 Word 檔案無文字。</p>'}</div>
          `;
        } else if (fileExt === 'pdf') {
          const arrayBuffer = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          let fullText = '';
          for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
            const page = await pdf.getPage(pageNum);
            const textContent = await page.getTextContent();
            const pageStr = textContent.items.map(s => s.str).join(' ');
            fullText += `<h4>第 ${pageNum} 頁</h4><p>${pageStr}</p><hr style="margin:1rem 0;">`;
          }
          generatedContent = `
            <span class="badge">PDF 講義</span>
            <h2>📑 ${escapeHtml(file.name)}</h2>
            <div style="margin-top:1rem;">${fullText || '<p>此 PDF 無可提取之純文字。</p>'}</div>
          `;
        } else {
          const text = await file.text();
          generatedContent = `
            <span class="badge">純文字</span>
            <h2>📝 ${escapeHtml(file.name)}</h2>
            <div style="margin-top:1rem; white-space: pre-wrap;">${escapeHtml(text)}</div>
          `;
        }

        const newDoc = { id: newId, title: fileNameNoExt, date: now, content: generatedContent };
        await saveDocToDB(newDoc);
        documents.push(newDoc);
      }

      renderFileList();
      selectDocument(documents[documents.length - 1].id);
      closeSidebar();
      event.target.value = '';
    }

    async function addYouTubeLink() {
      const url = prompt("請輸入 YouTube 影片網址：");
      if (!url) return;

      const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/);
      const videoId = (match && match[2].length === 11) ? match[2] : null;

      if (!videoId) {
        alert("無法識別此 YouTube 網址！");
        return;
      }

      const title = prompt("請為這支教學影片命名：", "線上教學影片") || "線上教學影片";
      const newId = 'doc-yt-' + Date.now();
      const now = new Date().toLocaleDateString('zh-TW');

      const content = `
        <span class="badge">YouTube 影音</span>
        <h2>🎬 ${escapeHtml(title)}</h2>
        <div class="yt-iframe-container">
          <iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>
        </div>
      `;

      const newDoc = { id: newId, title: `🎬 ${title}`, date: now, content };
      await saveDocToDB(newDoc);
      documents.push(newDoc);
      localStorage.removeItem('bp_user_cleared_all');

      renderFileList();
      selectDocument(newId);
      closeSidebar();
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    async function toggleEditMode() {
      const doc = documents.find(d => d.id === currentDocId);
      if (!doc) return;
      const card = document.getElementById('contentCard');
      const btn = document.getElementById('editToggleBtn');

      if (!isEditing) {
        isEditing = true;
        btn.innerText = '💾 儲存';
        card.innerHTML = `<textarea class="editable-area" id="docEditor">${doc.content}</textarea>`;
      } else {
        isEditing = false;
        btn.innerText = '✏️ 編輯';
        const updated = document.getElementById('docEditor').value;
        doc.content = updated;
        await saveDocToDB(doc);
        card.innerHTML = updated;
      }
    }

    function filterFiles() {
      renderFileList(document.getElementById('searchInput').value);
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(documents, null, 2));
      const a = document.createElement('a');
      a.href = dataStr;
      a.download = `背包客英文_備份_${Date.now()}.json`;
      a.click();
    }

    function escapeHtml(string) {
      return String(string).replace(/[&<>"']/g, s => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[s]));
    }

    window.onload = init;
  </script>
